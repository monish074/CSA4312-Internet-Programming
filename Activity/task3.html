
<!DOCTYPE html>
<html>
<head>
    <title>Text Design</title>

    <style>
        /* Element selector */
        h1 {
            color: darkblue;
            text-align: center;
            letter-spacing: 5px;
            font-weight: bold;
        }

        /* Element selector */
        p {
            color: green;
            font-size: 20px;
            letter-spacing: 2px;
            font-weight: 500;
        }

        /* Class selector */
        .highlight {
            color: red;
            font-weight: bold;
            letter-spacing: 3px;
        }

        /* ID selector */
        #message {
            color: purple;
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        /* Universal selector */
        * {
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    <h1>WELCOME TO MY WEBSITE</h1>

    <p>This is a simple HTML and CSS example.</p>

    <p class="highlight">This is highlighted text.</p>

    <p id="message">THANK YOU!</p>

</body>
</html>
