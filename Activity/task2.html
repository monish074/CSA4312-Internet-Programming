<!DOCTYPE html>
<html>
<head>
    <title>Indian Flag</title>

    <style>
        .flag {
            width: 450px;
            height: 300px;
            border: 1px solid black;
        }

        .saffron {
            height: 100px;
            background-color: #FF9933;
        }

        .white {
            height: 100px;
            background-color: white;
            position: relative;
        }

        .green {
            height: 100px;
            background-color: #138808;
        }

        .chakra {
            width: 70px;
            height: 70px;
            border: 4px solid #000080;
            border-radius: 50%;
            position: absolute;
            top: 11px;
            left: 190px;
        }
    </style>
</head>

<body>

    <h2>Indian National Flag</h2>

    <div class="flag">

        <div class="saffron"></div>

        <div class="white">
            <div class="chakra"></div>
        </div>

        <div class="green"></div>

    </div>

</body>
</html>
