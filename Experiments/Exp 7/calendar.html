<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reservations Calendar | LuxeLoom</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body><header class="site-header"><a class="brand" href="index.html">✦ LUXELOOM</a><nav class="nav"><a href="account.html">My account</a><a class="active" href="calendar.html">Calendar</a><a href="staff.html">Staff portal</a><a href="admin.html">Admin</a></nav></header><main class="page-wrap"><div class="dashboard-head"><div><span class="eyebrow">PLAN THE GOOD DAYS</span><h1>Reservations <em>calendar.</em></h1><p>View bookings, select a date and manage unavailable hours.</p></div><a class="btn btn-plum" href="booking.html">+ Add reservation</a></div><div class="calendar-layout"><section class="panel"><div class="calendar-top"><button id="prevMonth">←</button><h2 id="monthLabel"></h2><button id="nextMonth">→</button></div><div class="calendar-grid" id="calendarGrid"></div><div class="calendar-legend"><span><i class="dot dot-booked"></i> Bookings</span><span><i class="dot dot-blocked"></i> Locked</span><span><i class="dot dot-today"></i> Today</span></div></section><aside class="panel"><span class="eyebrow">DAILY OVERVIEW</span><h2 id="selectedDateLabel">Select a date</h2><div id="dayDetails"></div><hr><h3>Lock an unavailable hour</h3><form id="lockForm"><label>Time<select id="lockTime"><option>09:00</option><option>10:00</option><option>11:00</option><option>12:00</option><option>13:00</option><option>14:00</option><option>15:00</option><option>16:00</option><option>17:00</option></select></label><label>Reason<input id="lockReason" placeholder="Break / Closed / Staff leave"></label><button class="btn btn-dark btn-wide">Lock selected time</button></form><div id="lockedSlots"></div></aside></div></main></body></html>
