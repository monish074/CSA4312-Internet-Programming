<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Feedback | LuxeLoom</title><link rel="stylesheet" href="css/style.css"><script defer src="js/app.js"></script></head><body><header class="site-header"><a class="brand" href="index.html">✦ LUXELOOM</a><nav class="nav"><a href="index.html">Home</a><a href="account.html">My account</a><a class="active" href="feedback.html">Feedback</a></nav></header><main class="page-wrap narrow"><div class="page-hero compact"><span class="eyebrow">HELP US MAKE IT LOVELIER</span><h1>Your words make<br><em>a difference.</em></h1><p>Tell us about your experience. We read every suggestion.</p></div><form class="panel" id="feedbackForm"><label>Your name<input id="feedbackName" required></label><label>Email<input id="feedbackEmail" type="email"></label><label>Studio visited<select id="feedbackSalon"></select></label><label>Your rating<select id="feedbackRating"><option>5 - Loved it</option><option>4 - Great</option><option>3 - Good</option><option>2 - Could be better</option><option>1 - Needs improvement</option></select></label><label>Your feedback<textarea id="feedbackMessage" rows="5" required placeholder="Share your experience..."></textarea></label><button class="btn btn-plum btn-wide">Send feedback ↗</button></form></main></body></html>
